<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Online</title>
    <style>
        .ace_mobile-menu { display: none !important }
    
        * { box-sizing: border-box }
    
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
    
        body {
            padding-top: 10px;
        }
    
        #mainDiv {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            height: calc(100vh - 70px);
        }
    
        #code, #output {
            width: 100%;
            height: 50%;
            font-size: 14px;
        }
    
        #output {
            field-sizing: content;
            min-height: 200px;
            max-height: 100%;
            resize: vertical;
            overflow: auto;
        }
    
        @media (min-width: 769px) {
            #mainDiv { flex-direction: row }
            #code, #output {
                height: 100%;
                font-size: 18px;
            }
            #output { resize: none }
        }
    </style>
    <script src="./ace-editor/ace.js"></script>
</head>
<body>
    <strong style="margin-left: 10vw">JS Online</strong>
    <button onclick="runClick()" style="margin-left: 30vw">Run</button>
    <div id="mainDiv">
        <div id="code"></div>
        <textarea id="output" disabled wrap="off" autocomplete="off"></textarea>
    </div>

    <script>
        globalThis.codeEditor = ace.edit("code")
        globalThis.codeEditor.setShowPrintMargin(false)

        delete globalThis.codeEditor.keyBinding.$defaultHandler.commandKeyBinding["insert"]

        const session = globalThis.codeEditor.session
        session.setUseWorker(false)
        session.setUseWrapMode(true)
        session.setMode("ace/mode/javascript")

        const outputElement = document.querySelector('#output')

        let lastWorker

        function runClick() {
            outputElement.value = ''

            lastWorker?.terminate()
            const worker = new Worker('worker.js')
            worker.postMessage(globalThis.codeEditor.getValue())
            worker.onmessage = (event) => {
                outputElement.value = event.data
            }
            lastWorker = worker
        }
    </script>
</body>
</html>
